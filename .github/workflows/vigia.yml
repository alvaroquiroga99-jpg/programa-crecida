name: Vigía CRECIDA

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

jobs:
  ingesta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Instalar dependencias
        run: npm install firebase-admin playwright playwright-extra puppeteer-extra-plugin-stealth
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
      - name: Correr el vigía
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          NASA_MAP_KEY: ${{ secrets.NASA_MAP_KEY }}
        run: node tools/vigia.js
